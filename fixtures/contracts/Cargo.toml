[workspace]
resolver = "2"
members = ["vault-v1", "vault-v2-compatible", "vault-v2-risky", "vault-v2-breaking"]

[workspace.dependencies]
soroban-sdk = "27.0.6"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
